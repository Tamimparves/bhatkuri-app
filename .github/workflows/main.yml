name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ১. এখানে ubuntu apt এর বদলে অফিসিয়াল setup-android@v4 ব্যবহার করা হয়েছে
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Create Android project
        run: |
          # ফোল্ডার স্ট্রাকচার তৈরি
          mkdir -p bhatkuri-android/app/src/main/java/app/bhatkuri
          mkdir -p bhatkuri-android/app/src/main/res/mipmap-xxhdpi
          # আইকন কপি করা (আপনার রিপোজিটরিতে icon-192.png থাকতে হবে)
          cp icon-192.png bhatkuri-android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cd bhatkuri-android

          # settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Bhatkuri"
          include ':app'
          EOF

          # build.gradle (Root)
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          # gradle.properties
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          # app/build.gradle (এখানে android{} ব্লক এবং dependencies যোগ করা হয়েছে)
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'app.bhatkuri'
              compileSdk 34

              defaultConfig {
                  applicationId "app.bhatkuri"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # AndroidManifest.xml তৈরি
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Bhatkuri"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java তৈরি (এটি ছাড়া অ্যাপ ক্র্যাশ করবে)
          cat > app/src/main/java/app/bhatkuri/MainActivity.java << 'EOF'
          package app.bhatkuri;

          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView textView = new TextView(this);
                  textView.setText("Hello from Bhatkuri App!");
                  textView.setTextSize(24);
                  setContentView(textView);
              }
          }
          EOF

      - name: Make Gradlew executable and Build APK
        run: |
          cd bhatkuri-android
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bhatkuri-android/app/build/outputs/apk/debug/app-debug.apk
